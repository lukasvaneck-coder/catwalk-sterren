<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catwalk Sterren</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/parkour.css">
</head>
<body>
<div id="app">

  <!-- Startscherm: wie speelt er? -->
  <section id="screen-start" class="screen start">
    <div class="hero">
      <div class="logo">✦ <span>Catwalk Sterren<small>MIJN MODESHOW</small></span></div>
      <p class="tagline">Kleed je model aan en straal.<span>Verover de jury en speel steeds meer vrij.</span></p>
    </div>
    <p class="eyebrow">WIE GAAT ER SPELEN?</p>
    <div id="profiles" class="profiles"></div>
    <button class="btn violet big" id="btn-duel" type="button" hidden>⚔️ Samen spelen: duel!</button>
    <p class="footer-note">Jouw outfits, sterren en munten blijven op dit apparaat bewaard. <span>✦</span></p>
    <button class="btn ghost sm" data-settings type="button">⚙️ Instellingen</button>
  </section>

  <!-- Model maken of aanpassen -->
  <section id="screen-create" class="screen create" hidden>
    <h2 class="h" id="create-title">Maak je model</h2>
    <div class="create-grid">
      <div class="preview card" id="create-preview"></div>
      <div class="options">
        <label class="field" for="name-input"><span>Hoe heet je?</span><input id="name-input" maxlength="16" placeholder="Jouw naam" autocomplete="off"></label>
        <div class="field"><span>Huidskleur</span><div id="skin-swatches" class="swatches"></div></div>
        <div class="field"><span>Ogen</span><div id="eye-swatches" class="swatches"></div></div>
        <div class="field"><label for="build-range">Postuur</label><div class="slider-row"><span>dun</span><input type="range" id="build-range" min="0" max="100" step="1" value="40"><span>dik</span></div></div>
        <div class="field"><span>Kapsel</span><div id="hair-styles" class="mini-grid"></div></div>
        <div class="field"><span>Haarkleur</span><div id="hair-swatches" class="swatches"></div></div>
        <div class="row wrap">
          <button class="btn ghost" id="create-cancel" type="button">Terug</button>
          <button class="btn big" id="create-done" type="button">Klaar! ✨</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Het dorp: loop naar een huisje -->
  <section id="screen-world" class="screen world" hidden>
    <div class="world-top">
      <button class="btn ghost sm" id="btn-world-players" type="button">👤 Andere speler</button>
      <button class="btn ghost sm" data-settings type="button">⚙️ Instellingen</button>
      <button class="btn mint" id="btn-world-parkour" type="button">🏁 Raceparkours</button>
      <button class="btn mint" id="btn-world-learning" type="button">🌦️ Weer & budget</button>
      <p class="eyebrow">LOOP NAAR EEN HUISJE</p>
    </div>
    <div id="world"></div>
  </section>

  <!-- De kleedkamer -->
  <section id="screen-game" class="screen game" hidden>
    <header class="hud">
      <button class="chip" id="hud-profile" type="button" title="Wissel van speler">
        <span id="hud-avatar" class="mini"></span>
        <span class="chip-text"><b id="hud-name"></b><small id="hud-level"></small></span>
      </button>
      <div class="xp"><div class="xp-bar"><div id="xp-fill"></div></div><small id="xp-text"></small></div>
      <div class="hud-stars">⭐ <span id="hud-stars">0</span></div>
      <div class="hud-stars coins">🪙 <span id="hud-coins">0</span></div>
      <button class="btn gold sm" id="btn-shop" type="button">🛍️ Winkel</button>
      <button class="btn mint sm" id="btn-puzzle" type="button">🎨 Kleuratelier</button>
      <button class="btn mint sm" id="btn-learning" type="button">🌦️ Weer & budget</button>
      <button class="btn mint sm" id="btn-parkour" type="button">🏁 Parkours</button>
      <button class="btn ghost sm" id="btn-next" type="button" title="Wat speel je straks vrij?">🎁 Volgend level</button>
      <button class="btn ghost sm" id="btn-world" type="button" title="Terug naar het dorp">🏡 Dorp</button>
      <button class="btn ghost sm" id="btn-look" type="button">🪞 Uiterlijk</button>
      <button class="btn ghost sm" id="btn-sound" type="button" aria-label="Geluid aan of uit">🔊</button>
      <button class="btn ghost sm" data-settings type="button">⚙️ Instellingen</button>
    </header>

    <div class="challenge card" id="challenge"></div>

    <main class="room">
      <div class="stage card">
        <div id="stage"></div>
        <div class="stage-tools">
          <button class="btn ghost sm" id="btn-random" type="button">🎲 Verras me</button>
          <button class="btn ghost sm" id="btn-photo" type="button">📸 Foto</button>
          <button class="btn ghost sm" id="btn-clear" type="button">🧺 Alles uit</button>
        </div>
      </div>
      <aside class="closet card">
        <nav class="tabs" id="tabs" aria-label="Kledingkast"></nav>
        <div class="grid" id="grid"></div>
      </aside>
    </main>

    <footer class="actions">
      <button class="btn big" id="btn-jury" type="button">Naar de jury! ✨</button>
    </footer>
  </section>

  <section id="screen-parkour" class="screen" hidden><main id="parkour"></main></section>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/sound.js"></script>
<script src="js/data.js"></script>
<script src="js/color-challenges.js"></script>
<script src="js/learning-challenges.js"></script>
<script src="assets/doll-manifest.js"></script>
<script src="js/bg.js"></script>
<script src="js/avatar.js"></script>
<script src="js/world.js"></script>
<script src="js/parkour-rules.js"></script>
<script src="js/parkour.js"></script>
<script src="js/game.js"></script>
</body>
</html>
