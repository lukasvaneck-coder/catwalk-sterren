name: Publiceer op GitHub Pages

# Bij elke push naar main worden index.html, css/ en js/ naar de
# gh-pages-branch gekopieerd. GitHub Pages serveert die branch op
# https://lukasvaneck-coder.github.io/catwalk-sterren/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spelbestanden verzamelen
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
      - name: Naar gh-pages pushen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "Publiceer ${{ github.sha }}"
